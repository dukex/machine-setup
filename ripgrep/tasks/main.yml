- name: "ripgrep : install package (Debian based)"
  tags:
    - ripgrep
    - editor
    - vim
  become: yes
  package:
    name: ripgrep
    state: present
    update_cache: yes
  when:
    - is_debian

- name: "ripgrep : install package (Fedora, Arch)"
  tags:
    - ripgrep
    - editor
    - vim
  become: yes
  package:
    name: ripgrep 
    state: present
    update_cache: yes
  when:
    - is_arch

- name: "ripgrep : install package (macos)"
  tags:
    - ripgrep
    - editor
    - vim
  community.general.homebrew:
    name: ripgrep
  when: is_macos
