- name: "zsh : linux : install"
  tags:
    - zsh
  become: True
  package:
    name:
      - zsh
    state: latest
  when: is_linux

- name: "zsh : macos : install"
  tags:
    - zsh
  community.general.homebrew:
    name: zsh
  when: is_macos

- name: "zsh : create directories"
  tags:
    - zsh
    - zsh-config
    - antigen
  file:
    path: "{{ item }}"
    state: directory
  with_items:
    - ~/.zsh
    - ~/bin
    - ~/.config
    - ~/.antigen
  when: is_linux or is_macos

- name: "zsh : install antigen"
  tags:
    - zsh
    - zsh-config
    - antigen
  get_url:
    url: https://git.io/antigen
    dest: ~/.antigen/antigen.zsh
  when: is_linux or is_macos

- name: "zsh : linux : install starship"
  tags:
    - zsh
    - starship
  become: True
  package:
    name:
      - starship
    state: latest
  when: is_linux

- name: "zsh : macos : install starship"
  tags:
    - zsh
    - starship
  community.general.homebrew:
    name: starship
  when: is_macos

- name: "zsh : link .zshrc"
  tags:
    - zsh
    - zsh-config
  file:
    src: "~/.dotfiles/zsh/files/zshrc"
    dest: "~/.zshrc"
    state: link
    force: yes
  when: is_linux or is_macos

- name: "zsh : link starship.toml"
  tags:
    - zsh
    - zsh-config
    - starship
  file:
    src: "~/.dotfiles/zsh/files/starship.toml"
    dest: "~/.config/starship.toml"
    state: link
    force: yes
  when: is_linux or is_macos

- name: "zsh : link configuration"
  tags:
    - zsh
    - zsh-config
  file:
    src: "~/.dotfiles/zsh/files/{{ item }}.zsh"
    dest: "~/.zsh/{{ item }}.zsh"
    state: link
    force: yes
  with_items:
    - 0_path
    - 1_starship
    - aliases
    - antigen
    - mise
    - history
    - k8s
    - ollama
  when: is_linux or is_macos

- name: "zsh : install kube_alias"
  tags:
    - kube
    - zsh
  when: is_linux or is_macos
  get_url:
    url: https://raw.githubusercontent.com/ahmetb/kubectl-aliases/master/.kubectl_aliases
    dest: ~/.kubectl_aliases

- name: "zsh : install mise"
  tags:
    - zsh
    - mise
  shell: curl -fsSL https://mise.run | sh
  args:
    creates: ~/.local/bin/mise
  when: is_linux or is_macos

- name: "zsh : macos : shell tools"
  tags:
    - zsh
  community.general.homebrew:
    name:
      - fzf
      - yq
      - eza
  when: is_macos

- name: "zsh : linux : shell tools"
  tags:
    - zsh
  become: True
  package:
    name:
      - fzf
      - eza
    state: latest
  when: is_linux

- name: "zsh : linux : yq"
  tags:
    - zsh
  get_url:
    url: "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_{{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'amd64' }}"
    dest: ~/bin/yq
    mode: "0755"
  when: is_linux
